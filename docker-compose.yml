services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: autonomous
      POSTGRES_USER: autonomous
      POSTGRES_PASSWORD: autonomous_dev
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autonomous -d autonomous"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: {context: ./backend}
    environment:
      DATABASE_URL: postgresql+asyncpg://autonomous:autonomous_dev@postgres:5432/autonomous
      REDIS_URL: redis://redis:6379/0
      DASHBOARD_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      COOKIE_SECURE: "false"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      AUTONOMY_DRY_RUN: "true"
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build:
      context: ./backend
      dockerfile: railway.worker.Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://autonomous:autonomous_dev@postgres:5432/autonomous
      REDIS_URL: redis://redis:6379/0
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  dashboard:
    build:
      context: ./dashboard
      args: {NEXT_PUBLIC_API_URL: http://localhost:8000}
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  postgres_data:
