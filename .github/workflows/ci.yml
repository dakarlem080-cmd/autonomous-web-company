name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile backend
        run: |
          python - <<'PY'
          import py_compile
          import sys
          from pathlib import Path

          failures = 0
          for path in sorted(Path("app").rglob("*.py")):
              try:
                  py_compile.compile(str(path), doraise=True)
              except py_compile.PyCompileError as exc:
                  failures += 1
                  message = str(exc).replace("%", "%25").replace("\n", "%0A").replace("\r", "%0D")
                  print(f"::error file={path}::{message}")
          raise SystemExit(failures)
          PY
      - name: Ruff changed Python files
        run: |
          files=$(git diff --name-only origin/main...HEAD -- '*.py' | sed 's#^backend/##' | tr '\n' ' ')
          [ -z "$files" ] || ruff check $files
      - run: pytest -q
      - name: Type check changed files
        run: |
          files=$(git diff --name-only origin/main...HEAD -- '*.py' | sed 's#^backend/##' | tr '\n' ' ')
          [ -z "$files" ] || mypy $files --ignore-missing-imports --follow-imports=skip
      - name: Bandit changed files
        run: |
          files=$(git diff --name-only origin/main...HEAD -- '*.py' | sed 's#^backend/##' | tr '\n' ' ')
          [ -z "$files" ] || bandit -q $files
      - run: pip-audit -r requirements.txt

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Build dashboard
        run: npm run build
