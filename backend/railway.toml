# Force Railway to rebuild the backend from the current main branch.
# Vercel OAuth routes live in backend/app/main.py and must be deployed with this service.
[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
